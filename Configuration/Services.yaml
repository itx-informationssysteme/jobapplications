services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    ITX\Jobapplications\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Domain/Model/*'

    ITX\Jobapplications\Command\AnonymizeApplicationsCommand:
        tags:
            -   name: 'console.command'
                command: 'jobapplications:anonymizeApplicationsCommand'
                description: 'This command anonymizes applications and deletes the application''s files.'
                # not required, defaults to false
                hidden: false

    ITX\Jobapplications\Command\CleanUpApplicationsCommand:
        tags:
            -   name: 'console.command'
                command: 'jobapplications:cleanupApplicationsCommand'
                description: 'This command deletes applications and deletes the application''s files.'
                # not required, defaults to false
                hidden: false

    ITX\Jobapplications\Command\ProcessIndexingQueueCommand:
        tags:
            -   name: 'console.command'
                command: 'jobapplications:processindexingqueue'
                description: 'Processes pending Google Indexing API jobs for job postings.'

    ITX\Jobapplications\Hooks\DataHandlerIndexingHook:
        public: true

    ITX\Jobapplications\Service\IndexingQueueProcessor:
        public: true
